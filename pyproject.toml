[build-system]
requires = ["setuptools>=78.0"]
build-backend = "setuptools.build_meta"

[project]
name = "airwriting"
version = "0.1.0"
description = "Designing and Evaluating Interaction Mechanisms for a Finger-Based Air-Writing System"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.5",
  "scipy>=1.18",
  "opencv-contrib-python>=5.1",
  "mediapipe>=1.2",
  "PyQt5>=5.15.11",
  "torch>=2.15",
  "torchvision>=0.29",
  "matplotlib>=3.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.2",
  "ruff>=0.17",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
