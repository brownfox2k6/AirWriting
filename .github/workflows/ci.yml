name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Format, Lint & Test (Python 3.13 CPU)
    runs-on: ubuntu-latest

    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install headless OpenCV, MediaPipe & PyQt5 system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libglib2.0-0 \
            libegl1 \
            libdbus-1-3 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xfixes0

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.2" "torchvision>=0.17" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"

      - name: Auto-format & safe lint fixes with Ruff
        run: |
          ruff check --fix --exit-zero src tests
          ruff format src tests

      - name: Commit formatted changes
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          if [ -n "$(git status --porcelain src tests)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src tests
            git commit -m "style: auto-format with ruff"
            git push
          fi

      - name: Verify lint & formatting with Ruff
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Run pytest
        run: pytest -v
